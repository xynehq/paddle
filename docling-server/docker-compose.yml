version: '3.8'

services:
  docling-ocr:
    build: .
    container_name: docling-ocr
    ports:
      - "8001:8000"  # Using 8001 to avoid conflict with Paddle on 8000
    environment:
      - PYTHONUNBUFFERED=1
      # --- VLM configuration (required for scanned PDFs and image OCR) ---
      - VLM_PRESET=${VLM_PRESET:-lightonocr}
      - VLM_URL=${VLM_URL:-}
      - VLM_MODEL=${VLM_MODEL:-lightonai/LightOnOCR-2-1B}
      - VLM_ACCESS_TOKEN=${VLM_ACCESS_TOKEN:-}
    # NO volume mount on /root/.cache/huggingface — models are baked into the
    # image. Mounting a volume there would shadow them and cause offline errors.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
