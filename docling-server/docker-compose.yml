version: '3.8'

services:
  docling-ocr:
    build: .
    container_name: docling-ocr
    ports:
      - "8001:8000"  # Using 8001 to avoid conflict with Paddle on 8000
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Cache models between restarts
      - docling-models:/root/.cache/docling
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  docling-models:
